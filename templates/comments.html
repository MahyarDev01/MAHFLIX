<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظرات کاربران | MAHFLIX</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        
        :root {
            --bg-color: #0a0a0a;
            --card-bg: rgba(26, 26, 26, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-color: #FFFFFF;
            --text-muted: #888888;
            --primary-red: #E50914;
        }

        [data-theme="light"] {
            --bg-color: #F8F7FC;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-color: #1F2937;
            --text-muted: #6B7280;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            padding: 15px;
            transition: background 0.3s;
        }

        /* نوار بالای صفحه شیشه‌ای */
        .top-bar {
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            max-width: 700px; 
            width: 100%; 
            margin: 0 auto 20px auto;
            padding: 12px 16px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
        }
        .btn-back {
            display: flex; 
            align-items: center; 
            justify-content: center;
            width: 36px; 
            height: 36px; 
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-color); 
            text-decoration: none; 
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-back:hover { background: var(--primary-red); color: #fff; }
        .btn-back svg { width: 20px; height: 20px; fill: currentColor; }
        .page-title { font-size: 1rem; font-weight: 800; letter-spacing: 0.5px; }

        /* لیست نظرات */
        .comments-container {
            flex: 1; 
            max-width: 700px; 
            width: 100%; 
            margin: 0 auto;
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            overflow-y: auto; 
            padding-bottom: 95px;
        }
        
        /* کارت هر کامنت */
        .comment-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            gap: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.95rem;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }

        .comment-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .comment-author {
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .author-badge {
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(229, 9, 20, 0.15);
            color: var(--primary-red);
            font-weight: bold;
        }

        .comment-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .comment-body {
            font-size: 0.88rem;
            line-height: 1.6;
            color: var(--text-color);
            word-break: break-word;
        }

        /* اینپوت بار مدرن پایین */
        .input-bar {
            position: fixed; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%);
            width: calc(100% - 30px); 
            max-width: 700px;
            display: flex; 
            align-items: center;
            gap: 10px; 
            background: var(--card-bg);
            border: 1px solid var(--card-border); 
            border-radius: 20px; 
            padding: 8px 10px;
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }
        .comment-input {
            flex: 1; 
            background: transparent; 
            border: none; 
            outline: none;
            padding: 10px 14px; 
            color: var(--text-color); 
            font-size: 0.9rem;
        }
        .btn-send {
            background: linear-gradient(90deg, #E50914, #b81d24);
            color: #fff; 
            border: none;
            border-radius: 14px; 
            padding: 10px 18px; 
            font-weight: 700; 
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
        }
        .btn-send svg { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="javascript:history.back()" class="btn-back" title="بازگشت">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <h2 class="page-title">دیدگاه‌های کاربران</h2>
        <div style="width: 36px;"></div>
    </div>

    <div class="comments-container" id="commentsList">
        <span style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 40px;">در حال دریافت نظرات...</span>
    </div>

    <div class="input-bar">
        <input type="text" id="commentText" class="comment-input" placeholder="نظر خود را درباره این فیلم بنویسید..." autocomplete="off">
        <button class="btn-send" onclick="sendComment()">
            <span>ارسال</span>
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script>
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('video_id');

        // پالت رنگی آواتارها
        const avatarColors = ['#6D28D9', '#8B5CF6', '#22C55E', '#E50914', '#3B82F6', '#EC4899'];

        function getAvatarColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return avatarColors[Math.abs(hash) % avatarColors.length];
        }

        function loadComments() {
            fetch(`/api/content/${videoId}/comments/`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('commentsList');
                    if (!data || data.length === 0) {
                        list.innerHTML = `
                            <div style="text-align: center; margin-top: 50px; color: var(--text-muted);">
                                <svg style="width: 48px; height: 48px; fill: var(--text-muted); margin-bottom: 10px;" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
                                <p style="font-size: 0.9rem;">هنوز هیچ دیدگاهی ثبت نشده است.</p>
                                <span style="font-size: 0.8rem;">اولین نفری باشید که نظر می‌دهد!</span>
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    data.forEach(c => {
                        const maskedPhone = c.user_phone ? c.user_phone.slice(0, 4) + '***' + c.user_phone.slice(-3) : 'کاربر مهمان';
                        const firstChar = c.user_phone ? c.user_phone.slice(-2) : 'M';
                        const bgCol = getAvatarColor(maskedPhone);

                        html += `
                            <div class="comment-card">
                                <div class="avatar" style="background: ${bgCol};">${firstChar}</div>
                                <div class="comment-content">
                                    <div class="comment-header">
                                        <div class="comment-author">
                                            <span>${maskedPhone}</span>
                                            <span class="author-badge">بیننده</span>
                                        </div>
                                    </div>
                                    <p class="comment-body">${c.text}</p>
                                </div>
                            </div>
                        `;
                    });
                    list.innerHTML = html;
                })
                .catch(err => console.error("Error loading comments:", err));
        }

        loadComments();

        function sendComment() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                alert("برای ثبت نظر ابتدا باید وارد حساب کاربری شوید.");
                return;
            }
            const input = document.getElementById('commentText');
            const text = input.value.trim();
            if (!text) return;

            fetch(`/api/content/${videoId}/comments/`, {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ text: text })
            })
            .then(res => {
                if(res.ok) {
                    input.value = '';
                    loadComments(); // بروزرسانی آنی لیست با کامنت جدید
                } else {
                    alert("خطا در ارسال نظر.");
                }
            })
            .catch(err => console.error("Comment submit error:", err));
        }

        // ارسال با کلید Enter
        document.getElementById('commentText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                sendComment();
            }
        });
    </script>
</body>
</html>
