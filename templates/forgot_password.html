<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فراموشی رمز عبور | MAHFLIX</title>
    <style>
        /* تنظیمات پایه و فونت */
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            /* مسیر عکس بک‌گراند */
            background: linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.95)), url('../static/image/bg-movies.jpg') no-repeat center center/cover;
            background-color: #0a0a0a;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* بخش لوگو بیرون از باکس */
        .brand-logo {
            text-align: center;
            margin-bottom: 5px;
        }

        .brand-logo img {
            max-width: 320px; 
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(229, 9, 20, 0.4));
        }

        /* کارت شیشه‌ای و مدرن فرم */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        /* عنوان فرم */
        .form-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        
        /* متن راهنما */
        .subtitle {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* استایل فیلدها با لیبل شناور */
        .input-box {
            position: relative;
            margin-bottom: 25px;
            text-align: right;
        }

        .input-box input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-box input:focus, 
        .input-box input:not(:placeholder-shown) {
            border-color: #E50914;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 12px rgba(229, 9, 20, 0.2);
        }

        .input-box label {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.95rem;
            pointer-events: none;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .input-box input:focus ~ label,
        .input-box input:not(:placeholder-shown) ~ label {
            top: -10px;
            right: 15px;
            font-size: 0.8rem;
            color: #E50914;
            background-color: #1a1a1a;
            padding: 0 8px;
            border-radius: 4px;
        }

        /* گروه دکمه‌ها */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #E50914, #b81d24);
            color: #0a0a0a;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.6);
        }

        .back-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- لوگوی تصویر بیرون از باکس -->
    <div class="brand-logo">
        <img src="../static/image/full_logo.png" alt="MAHFLIX Logo">
    </div>

    <div class="login-card">
        <!-- عنوان باکس -->
        <h2 class="form-title">تغییر رمزعبور</h2>
        <p class="subtitle">ایمیل یا شماره موبایل خود را وارد کنید تا کد تایید برای شما ارسال شود.</p>

        <form id="forgotForm">
            <!-- فیلد ورودی -->
            <div class="input-box">
                <input type="text" id="identity" placeholder=" " required>
                <label for="identity">ایمیل یا شماره موبایل</label>
            </div>

            <!-- دکمه‌ها -->
            <div class="btn-group">
                <button type="submit" class="submit-btn">ارسال کد</button>
                <a href="/" class="back-btn">بازگشت</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const identity = document.getElementById('identity').value;

            fetch('/api/users/forgot-password/send-otp/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone_number: identity })
            }).then(res => res.json()).then(data => {
                if(data.message) {
                    localStorage.setItem('auth_phone', identity);
                    localStorage.setItem('auth_action', 'forgot_password');
                    window.location.href = '/otp-verify/';
                } else {
                    alert(data.error || "کاربری با این مشخصات یافت نشد.");
                }
            });
        });
    </script>

</body>
</html>
