<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | MAHFLIX</title>
    <style>
        /* تنظیمات پایه و فونت */
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            /* مسیر عکس بک‌گراند هم بر اساس دایرکتوری شما آپدیت شد (اختیاری) */
            background: linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.95)), url('../static/image/bg-movies.jpg') no-repeat center center/cover;
            background-color: #0a0a0a;
            color: #FFFFFF;
            display: flex;
            flex-direction: column; /* اضافه شدن این خط برای زیر هم قرار گرفتن لوگو و باکس */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* بخش لوگو بیرون از باکس */
        .brand-logo {
            text-align: center;
            margin-bottom: 5px; /* فاصله از باکس ورود */
        }

        .brand-logo img {
            max-width: 320px; 
            height: auto;
            /* اصلاح ارور سایه */
            filter: drop-shadow(0 4px 8px rgba(229, 9, 20, 0.4));
        }

        /* کارت شیشه‌ای و مدرن فرم */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* عنوان فرم (وارد شوید) */
        .form-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 35px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* استایل فیلدها با لیبل شناور */
        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        .input-box input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-box input:focus, 
        .input-box input:valid {
            border-color: #E50914;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 12px rgba(229, 9, 20, 0.2);
        }

        .input-box label {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.95rem;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-box input:focus ~ label,
        .input-box input:valid ~ label {
            top: -10px;
            right: 15px;
            font-size: 0.8rem;
            color: #E50914;
            background-color: #1a1a1a;
            padding: 0 8px;
            border-radius: 4px;
        }

        .forgot-password {
            display: block;
            text-align: right;
            color: #aaa;
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 35px;
            transition: color 0.3s ease;
            margin-top: -10px;
        }

        .forgot-password:hover {
            color: #E50914;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #E50914, #b81d24);
            color: #0a0a0a;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            margin-bottom: 25px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.6);
        }

        .signup-link {
            text-align: center;
            font-size: 0.95rem;
            color: #888;
        }

        .signup-link a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            margin-right: 5px;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #E50914;
        }
    </style>
</head>
<body>

    <!-- لوگوی تصویر بیرون از باکس -->
    <div class="brand-logo">
        <!-- مسیر عکس با توجه به دایرکتوری شما تنظیم شد -->
        <img src="../static/image/full_logo.png" alt="MAHFLIX Logo">
    </div>

    <div class="login-card">
        <!-- عنوان باکس -->
        <h2 class="form-title">وارد شوید</h2>

        <form id="loginForm">
            <!-- فیلد ایمیل/شماره با لیبل شناور -->
            <div class="input-box">
                <input type="text" id="identity" required>
                <label for="identity">ایمیل یا شماره موبایل</label>
            </div>

            <!-- فیلد رمز عبور با لیبل شناور -->
            <div class="input-box">
                <input type="password" id="password" required>
                <label for="password">رمز عبور</label>
            </div>

            <a href="/forgot-password/" class="forgot-password">رمز عبور خود را فراموش کرده‌اید؟</a>

            <button type="submit" class="submit-btn">ورود به حساب</button>

            <div class="signup-link">
                <span>حساب کاربری ندارید؟</span>
                <a href="/register/">ثبت‌نام کنید</a>
            </div>
        </form>
    </div>

    <script>
        if (localStorage.getItem('access_token')) {
            window.location.href = '/home/';
        }
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // جلوگیری از رفرش صفحه
            const identity = document.getElementById('identity').value;
            const password = document.getElementById('password').value;

            fetch('/api/users/login/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ login_id: identity, password: password })
            }).then(res => res.json()).then(data => {
                if(data.tokens) {
                    localStorage.setItem('access_token', data.tokens.access);
                    localStorage.setItem('refresh_token', data.tokens.refresh);
                    window.location.href = '/home/'; // انتقال به صفحه اصلی
                } else {
                    alert(data.error || "نام کاربری یا رمز عبور اشتباه است.");
                }
            });
        });
    </script>

</body>
</html>
