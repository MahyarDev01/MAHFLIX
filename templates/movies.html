{% extends 'base.html' %}
{% load static %}

<!-- فعال کردن تب فیلم‌ها در نوبار پایین -->
{% block nav_movies %}active{% endblock %}

{% block extra_css %}
<style>
    .section-header { 
        width: 90%; max-width: 900px; margin: 10px auto 15px auto; 
        display: flex; justify-content: space-between; align-items: center; 
    }
    .section-title { 
        font-size: 1.2rem; font-weight: 800; 
        border-right: 4px solid var(--primary-red); padding-right: 10px; color: var(--text-color); 
    }

    /* نوار چیپس‌های فیلتر دسته‌بندی */
    .filter-scroll-wrapper {
        width: 90%; max-width: 900px; margin: 0 auto 20px auto;
        display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
        scrollbar-width: none; -ms-overflow-style: none;
    }
    .filter-scroll-wrapper::-webkit-scrollbar { display: none; }

    .category-chip {
        background: var(--card-bg); border: 1px solid var(--card-border);
        color: var(--text-muted); padding: 7px 16px; border-radius: 20px;
        font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap;
        transition: all 0.2s ease; backdrop-filter: blur(10px);
    }
    .category-chip:hover { border-color: rgba(229, 9, 20, 0.4); color: var(--text-color); }
    .category-chip.active {
        background: var(--primary-red); color: #fff; border-color: var(--primary-red);
        box-shadow: 0 3px 12px rgba(229, 9, 20, 0.4);
    }

    /* گرید مرتب فیلم‌ها */
    .movies-grid {
        width: 90%; max-width: 900px; margin: 0 auto 30px auto;
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
    }

    .movie-card-grid {
        background: var(--card-bg); border: 1px solid var(--card-border);
        border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
        box-shadow: 0 6px 18px rgba(0,0,0,0.25); backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px); position: relative; transition: transform 0.2s, border-color 0.2s;
    }
    .movie-card-grid:hover {
        transform: translateY(-4px); border-color: rgba(229, 9, 20, 0.35);
    }

    .card-poster {
        width: 100%; height: 210px; object-fit: cover; display: block;
    }

    .premium-ribbon {
        position: absolute; top: 10px; right: 10px; background: var(--primary-red);
        color: #fff; font-size: 0.65rem; font-weight: 800; padding: 3px 8px;
        border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 2;
    }

    .card-body {
        padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1;
    }

    .card-title {
        font-size: 0.88rem; font-weight: 800; color: var(--text-color);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* برچسب‌های ژانر کوچک */
    .card-tags {
        display: flex; gap: 4px; overflow: hidden; flex-wrap: nowrap;
    }
    .card-tag {
        font-size: 0.65rem; color: var(--text-muted); background: rgba(255, 255, 255, 0.05);
        padding: 2px 6px; border-radius: 4px; border: 1px solid var(--card-border);
        white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
    }

    .card-meta-row {
        display: flex; justify-content: space-between; align-items: center;
        font-size: 0.75rem; color: var(--text-muted); margin-top: auto; padding-top: 4px;
    }

    .meta-group {
        display: flex; align-items: center; gap: 3px; cursor: pointer; text-decoration: none; color: inherit;
    }
    .meta-group svg { width: 14px; height: 14px; }

    .btn-grid-watch {
        background: var(--primary-red); color: #fff; border: none;
        padding: 7px; border-radius: 8px; font-size: 0.78rem; font-weight: 700;
        cursor: pointer; transition: background 0.2s; width: 100%; text-align: center;
    }
    .btn-grid-watch:hover { background: #b81d24; }
</style>
{% endblock %}

{% block content %}
    <div class="section-header">
        <h2 class="section-title">آرشیو فیلم و سریال‌ها</h2>
        <span id="videoCountBadge" style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold;">۰ عنوان</span>
    </div>

    <!-- فیلترهای افقی اسکرولی -->
    <div class="filter-scroll-wrapper" id="categoryFilterContainer">
        <button class="category-chip active" onclick="filterCategory('all', this)">همه</button>
        <button class="category-chip" onclick="filterCategory('movie', this)">فیلم‌ها</button>
        <button class="category-chip" onclick="filterCategory('series', this)">سریال‌ها</button>
    </div>

    <!-- لیست گرید محتوا -->
    <div class="movies-grid" id="moviesGridContainer">
        <span style="color: var(--text-muted); font-size: 0.85rem; padding: 20px;">در حال بارگذاری آرشیو...</span>
    </div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    const token = localStorage.getItem('access_token');
    const authHeaders = token ? { 'Authorization': 'Bearer ' + token } : {};

    let allMovies = [];
    let activeFilter = 'all';

    const gridContainer = document.getElementById('moviesGridContainer');
    const countBadge = document.getElementById('videoCountBadge');

    function createGridCard(v) {
        const cover = `/static/${v.cover_path}`;
        const heartColor = v.is_liked ? '#E50914' : 'var(--text-muted)';
        const viewColor = v.is_watched ? '#3B82F6' : 'var(--text-muted)';
        const commentColor = v.has_commented ? '#22C55E' : 'var(--text-muted)';

        const premiumBadge = v.is_premium_only ? `<span class="premium-ribbon">ویژه</span>` : '';

        // ساخت برچسب دسته‌بندی‌ها
        let tagsHtml = '';
        if (v.categories && v.categories.length > 0) {
            v.categories.slice(0, 2).forEach(cat => {
                tagsHtml += `<span class="card-tag">${cat.name}</span>`;
            });
        } else {
            tagsHtml = `<span class="card-tag">${v.video_type === 'movie' ? 'فیلم' : 'سریال'}</span>`;
        }

        return `
            <div class="movie-card-grid" id="card-${v.id}">
                ${premiumBadge}
                <img src="${cover}" alt="${v.title}" class="card-poster">
                <div class="card-body">
                    <div class="card-title" title="${v.title}">${v.title}</div>
                    <div class="card-tags">${tagsHtml}</div>
                    
                    <div class="card-meta-row">
                        <!-- لایک -->
                        <div class="meta-group" onclick="handleLike(${v.id})">
                            <span id="like-count-${v.id}">${v.likes_count}</span>
                            <svg viewBox="0 0 24 24" id="heart-icon-${v.id}" style="fill: ${heartColor};">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                            </svg>
                        </div>
                        <!-- بازدید -->
                        <div class="meta-group">
                            <span id="view-count-${v.id}">${v.views_count}</span>
                            <svg viewBox="0 0 24 24" id="view-icon-${v.id}" style="fill: ${viewColor};">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </div>
                        <!-- کامنت -->
                        <a href="/comments/?video_id=${v.id}" class="meta-group">
                            <span>${v.comments_count || 0}</span>
                            <svg viewBox="0 0 24 24" style="fill: ${commentColor};">
                                <path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18zM18 14H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
                            </svg>
                        </a>
                    </div>
                    
                    <button class="btn-grid-watch" onclick="handleWatch(${v.id})">مشاهده</button>
                </div>
            </div>
        `;
    }

    function renderMovies(list) {
        if (!list || list.length === 0) {
            gridContainer.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem;padding:20px;grid-column: 1/-1;">موردی در این دسته‌بندی یافت نشد.</span>';
            countBadge.innerText = '۰ عنوان';
            return;
        }

        let html = '';
        list.forEach(item => {
            html += createGridCard(item);
        });
        gridContainer.innerHTML = html;
        countBadge.innerText = `${list.length} عنوان`;
    }

    // دریافت لیست دسته‌بندی‌ها برای فیلتر
    fetch('/api/content/categories/')
        .then(res => res.json())
        .then(categories => {
            const filterContainer = document.getElementById('categoryFilterContainer');
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-chip';
                btn.innerText = cat.name;
                btn.onclick = () => filterCategory(`cat_${cat.id}`, btn);
                filterContainer.appendChild(btn);
            });
        })
        .catch(err => console.error("Categories error:", err));

    // لود همه فیلم‌ها
    fetch('/api/content/list/', { headers: authHeaders })
        .then(res => res.json())
        .then(videos => {
            allMovies = videos;
            renderMovies(allMovies);
        })
        .catch(err => console.error("Movies error:", err));

    // لاجیک فیلتر کردن چیپس‌ها
    window.filterCategory = function(criteria, btnElement) {
        document.querySelectorAll('.category-chip').forEach(b => b.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');

        activeFilter = criteria;

        if (criteria === 'all') {
            renderMovies(allMovies);
        } else if (criteria === 'movie' || criteria === 'series') {
            const filtered = allMovies.filter(v => v.video_type === criteria);
            renderMovies(filtered);
        } else if (criteria.startsWith('cat_')) {
            const catId = parseInt(criteria.replace('cat_', ''));
            const filtered = allMovies.filter(v => v.categories && v.categories.some(c => c.id === catId));
            renderMovies(filtered);
        }
    };

    // لایک اختصاصی با هماهنگی و توست
    window.handleLike = function(videoId) {
        if (!token) {
            showToast("برای لایک کردن لطفاً ابتدا وارد حساب شوید.", "error");
            return;
        }

        fetch(`/api/content/${videoId}/like/`, {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            }
        })
        .then(res => res.json())
        .then(data => {
            if (data.likes_count !== undefined) {
                const countEl = document.getElementById(`like-count-${videoId}`);
                const heartEl = document.getElementById(`heart-icon-${videoId}`);
                if (countEl) countEl.innerText = data.likes_count;
                if (heartEl) heartEl.style.fill = data.liked ? '#E50914' : 'var(--text-muted)';
                showToast(data.liked ? "به علاقه‌مندی‌ها اضافه شد." : "لایک حذف شد.", "info");
            }
        });
    };

    // تماشا با بررسی دسترسی کاربر ویژه و هدایت خودکار
    window.handleWatch = function(videoId) {
        const reqHeaders = token ? { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };

        fetch(`/api/content/${videoId}/watch/`, {
            method: 'POST',
            headers: reqHeaders
        })
        .then(async res => {
            const data = await res.json();
            if (res.status === 403) {
                showToast("این محتوا مخصوص کاربران ویژه است! در حال انتقال به کیف پول...", "error");
                addNotification("محتوای ویژه نیازمند تهیه اشتراک است.");
                setTimeout(() => {
                    window.location.href = '/wallet/';
                }, 2000);
                return;
            }

            if (!res.ok) {
                showToast(data.error || "خطایی رخ داد.", "error");
                return;
            }

            const viewEl = document.getElementById(`view-count-${videoId}`);
            if (viewEl && data.views_count) viewEl.innerText = data.views_count;
            const viewIcon = document.getElementById(`view-icon-${videoId}`);
            if (viewIcon) viewIcon.style.fill = '#3B82F6';

            if (data.video_url && data.video_url.trim() !== '') {
                window.open(data.video_url, '_blank');
            } else {
                showToast("لینک پخشی برای این فیلم تنظیم نشده است.", "error");
            }
        })
        .catch(err => console.error("Watch error:", err));
    };
})();
</script>
{% endblock %}
