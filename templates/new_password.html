<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر رمز عبور | MAHFLIX</title>
    <style>
        /* تنظیمات پایه و فونت */
        @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            /* مسیر عکس بک‌گراند */
            background: linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.95)), url('../static/image/bg-movies.jpg') no-repeat center center/cover;
            background-color: #0a0a0a;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* بخش لوگو بیرون از باکس */
        .brand-logo {
            text-align: center;
            margin-bottom: 5px;
        }

        .brand-logo img {
            max-width: 320px; 
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(229, 9, 20, 0.4));
        }

        /* کارت شیشه‌ای و مدرن فرم */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(25, 25, 25, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* عنوان فرم */
        .form-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        /* متن راهنما */
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* استایل فیلدها با لیبل شناور */
        .input-box {
            position: relative;
            margin-bottom: 25px;
        }

        .input-box input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-box input:focus, 
        .input-box input:not(:placeholder-shown) {
            border-color: #E50914;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 12px rgba(229, 9, 20, 0.2);
        }

        .input-box label {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.95rem;
            pointer-events: none;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .input-box input:focus ~ label,
        .input-box input:not(:placeholder-shown) ~ label {
            top: -10px;
            right: 15px;
            font-size: 0.8rem;
            color: #E50914;
            background-color: #1a1a1a;
            padding: 0 8px;
            border-radius: 4px;
        }

        /* گروه دکمه‌ها */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(90deg, #E50914, #b81d24);
            color: #0a0a0a;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.6);
        }

        /* دکمه بازگشت */
        .back-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- لوگوی تصویر بیرون از باکس -->
    <div class="brand-logo">
        <img src="../static/image/full_logo.png" alt="MAHFLIX Logo">
    </div>

    <div class="login-card">
        <!-- عنوان باکس -->
        <h2 class="form-title">تغییر رمزعبور</h2>
        <p class="subtitle">رمز عبور جدید خود را وارد کنید.</p>

        <form id="resetForm">
            <!-- رمز عبور جدید -->
            <div class="input-box">
                <input type="password" id="new_password" placeholder=" " required>
                <label for="new_password">رمز عبور جدید</label>
            </div>

            <!-- تکرار رمز عبور جدید -->
            <div class="input-box">
                <input type="password" id="confirm_new_password" placeholder=" " required>
                <label for="confirm_new_password">تکرار رمز جدید</label>
            </div>

            <!-- گروه دکمه‌ها -->
            <div class="btn-group">
                <button type="submit" class="submit-btn">تغییر رمز</button>
                <a href="/" class="back-btn">بازگشت</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const new_password = document.getElementById('new_password').value;
            const confirm_new_password = document.getElementById('confirm_new_password').value;

            if (new_password !== confirm_new_password) {
                alert("رمز عبور و تکرار آن یکسان نیست!");
                return;
            }

            const phone = localStorage.getItem('auth_phone');
            const otp = localStorage.getItem('auth_otp');

            fetch('/api/users/forgot-password/reset/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone_number: phone, otp: otp, new_password: new_password })
            }).then(res => res.json()).then(data => {
                if(data.message) {
                    alert("رمز عبور با موفقیت تغییر کرد! حالا می‌توانید وارد شوید.");
                    localStorage.removeItem('auth_phone');
                    localStorage.removeItem('auth_otp');
                    localStorage.removeItem('auth_action');
                    window.location.href = '/';
                } else {
                    alert(data.error || "خطایی رخ داد یا زمان کد به پایان رسیده است.");
                }
            });
        });
    </script>

</body>
</html>
